[project]
name = "turbofan-rul"
version = "0.1.0"
description = "Remaining Useful Life prediction for turbofan engines (NASA C-MAPSS) with asymmetric maintenance costs"
readme = "README.md"
authors = [{ name = "Alex Munoz Estornell", email = "alexestornell@gmail.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turbofan_rul"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
